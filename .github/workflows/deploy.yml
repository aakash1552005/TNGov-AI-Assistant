name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Guard: Only verify after CI passes ─────────────────────────
  ci-check:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm branch is main/master
        run: echo "Verifying production deployment for commit ${{ github.sha }}"

  # ── Backend Deployment (Railway Native Deploy) ────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: ci-check
    steps:
      - name: Verify Backend /health Endpoint
        run: |
          echo "Checking Railway Backend Health..."
          curl -f "https://backend-production-0a73.up.railway.app/health" | python3 -m json.tool
          echo "Backend deployment to Railway verified successfully!"

  # ── Frontend Deployment (Railway Native Deploy) ───────────────────
  deploy-frontend:
    name: Deploy Frontend → Railway
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Verify Frontend HTTP Status
        run: |
          echo "Checking Railway Frontend Availability..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://frontend-production-ee49.up.railway.app")
          if [ "$STATUS" = "200" ]; then
            echo "Frontend deployment to Railway verified successfully (HTTP $STATUS)."
          else
            echo "Frontend returned HTTP $STATUS."
          fi
